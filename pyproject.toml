[project]
name = "atlasrag"
version = "0.1.0"
description = "A production-grade enterprise retrieval and knowledge assistant."
readme = "README.md"
authors = [
    { name = "Abhishek Dutta", email = "abhishek.dutta1337@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "docling>=2.121.0",
    "pydantic>=2.13.4",
]

[project.scripts]
atlasrag = "atlasrag:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
